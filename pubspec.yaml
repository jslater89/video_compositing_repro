name: compositing_repro
description: Minimal Linux repro for FVP + overlay compositing chroma artifacts.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  fvp: ^0.36.2
  video_player: ^2.11.1
  window_manager: ^0.5.1
  synthetic_texture:
    path: packages/synthetic_texture

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/video.mp4
    - assets/overlay.png
    - assets/video_rgba.bin
